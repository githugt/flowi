# GoReleaser configuration for the flowi command line. Releases are cut by
# .github/workflows/release-cli.yml when a cli/v* tag is pushed; nothing here is run
# by the normal CI. The binary has no cgo (design 13.0), so every target is a
# plain cross-compile. The version printed by `flowi version` is the tag, given to the
# linker below.
version: 2

project_name: flowi

builds:
  - id: flowi
    main: ./cmd/flowi
    binary: flowi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Go does not stamp a version into a module in a subfolder, so the tag (cli/v1.2.3) is given to the linker.
    ldflags:
      - -s -w -X github.com/githugt/flowi/cli/internal/buildinfo.stamped=v{{ trimprefix .Tag "cli/v" }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: flowi
    # {{ .Tag }} is cli/v1.2.3 in this monorepo, so the folder prefix and the v are cut off.
    name_template: "flowi_{{ trimprefix .Tag \"cli/v\" }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# The release notes come from git-cliff (`git cliff --latest`), passed with
# --release-notes, so GoReleaser's own changelog is switched off.
changelog:
  disable: true

# A tag with a pre-release suffix (v0.1.0-alpha.1) is published as a GitHub pre-release.
release:
  name_template: "flowi {{ trimprefix .Tag \"cli/\" }}"
  prerelease: auto
