# Weekly pull requests for out-of-date dependencies, and at once for security fixes.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /lib
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
