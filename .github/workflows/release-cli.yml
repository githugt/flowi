name: release-cli

# Push a cli/v* tag (for example cli/v0.3.0-alpha.1) to release the command line tool.
on:
  push:
    tags: ["cli/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff reads the history and the tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - name: release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cli/cliff.toml
          args: --latest --strip header --include-path "cli/**"
        env:
          OUTPUT: cli/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      # The tag is cli/v1.2.3; the archives are named and stamped with 1.2.3.
      - name: build the archives
        run: scripts/dist.sh "${GITHUB_REF_NAME#cli/v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
            cli/dist/checksums.txt
          body_path: cli/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
