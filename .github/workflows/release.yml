name: release

# Builds the app for each system and attaches the packages to a GitHub release.
# Push a v* tag to release, or run it by hand from the Actions tab to build the packages
# without releasing (they are kept as workflow artifacts for a week).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version Go stamps into the binary comes from the tag
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config libfuse2t64 file
      - name: install NSIS (the Windows installer builder)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      # The packaging tool, at the version the app is built against.
      - name: install the wails3 tool
        shell: bash
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"

      - name: package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task package
          ditto -c -k --keepParent bin/flowi.app "bin/Flow-I-${{ github.ref_name }}-macos-arm64.zip"
      - name: package (Windows)
        if: runner.os == 'Windows'
        run: wails3 task package
      - name: package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:build
          wails3 task linux:create:appimage
          wails3 task linux:create:deb

      - uses: actions/upload-artifact@v4
        with:
          name: flowi-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/*.zip
            bin/*.exe
            bin/*.AppImage
            bin/*.deb

  release:
    name: publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
