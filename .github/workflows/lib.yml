name: lib

on:
  push:
    branches: [master]
    paths: [lib/**, .github/workflows/lib.yml]
  pull_request:
    paths: [lib/**, .github/workflows/lib.yml]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: lib

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: lib/go.mod
      # -race needs cgo at test time only; release builds stay cgo-free.
      - run: go test -race ./...

  nocgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: lib/go.mod
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: lib/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: lib

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: lib/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
