name: release

# Builds the app for each system and attaches the packages to a GitHub release.
# Push an app/v* tag to release, or run it by hand from the Actions tab to build the packages
# without releasing (they are kept as workflow artifacts for a week).
on:
  push:
    tags: ["app/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version Go stamps into the binary comes from the tag
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The version is the tag without its "v"; a manual run has no tag and makes a 0.0.0-dev build.
      - name: work out the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#app/v}"; else version="0.0.0-dev"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: install the Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: install NSIS (the Windows installer builder)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      # The packaging tool, at the version the app is built against.
      - name: install the wails3 tool
        shell: bash
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"

      - name: package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task package
          ditto -c -k --keepParent bin/flowi-gui.app "bin/flowi-app_${VERSION}_macos_arm64.zip"
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wails3 task package
          mv bin/*installer.exe "bin/flowi-app_${VERSION}_windows_amd64_setup.exe"
      # The packages carry the dependencies, so the package manager installs what the window needs. An AppImage is not
      # offered: WebKitGTK has the Debian helper paths compiled in, so it only starts on Debian and Ubuntu.
      - name: package (Linux)
        if: runner.os == 'Linux'
        env:
          GOARCH: amd64
        run: |
          wails3 task linux:build
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          wails3 task linux:generate:aur
          mv bin/flowi-app.deb "bin/flowi-app_${VERSION}_linux_amd64.deb"
          mv bin/flowi-app.rpm "bin/flowi-app_${VERSION}_linux_amd64.rpm"
          mv bin/flowi-app.pkg.tar.zst "bin/flowi-app_${VERSION}_linux_amd64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: flowi-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: app/bin/flowi-app_*

  # Installs each package into a clean container: the package manager must find every dependency, and the program must
  # have no shared library missing. This is what catches a wrong package name.
  verify-linux:
    name: install the Linux packages
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowi-ubuntu-latest
          path: packages
      - name: Debian and Ubuntu (.deb)
        run: |
          docker run --rm -v "$PWD/packages:/p" ubuntu:24.04 bash -euxo pipefail -c '
            apt-get update && apt-get install -y /p/*_linux_amd64.deb
            ! ldd /usr/bin/flowi-app | grep "not found"
            test ! -e /usr/bin/flowi
            command -v bwrap xdg-dbus-proxy
            ls /usr/lib/*/webkitgtk-6.0/WebKitNetworkProcess'
      - name: Arch (.pkg.tar.zst)
        run: |
          docker run --rm -v "$PWD/packages:/p" archlinux bash -euxo pipefail -c '
            pacman -Syu --noconfirm && pacman -U --noconfirm /p/*_linux_amd64.pkg.tar.zst
            ! ldd /usr/bin/flowi-app | grep "not found"
            test ! -e /usr/bin/flowi
            command -v bwrap xdg-dbus-proxy
            ls /usr/lib/webkitgtk-6.0/WebKitNetworkProcess'
      - name: Fedora (.rpm)
        run: |
          docker run --rm -v "$PWD/packages:/p" fedora bash -euxo pipefail -c '
            dnf install -y /p/*_linux_amd64.rpm
            ! ldd /usr/bin/flowi-app | grep "not found"
            test ! -e /usr/bin/flowi
            command -v bwrap xdg-dbus-proxy
            ls /usr/lib*/webkitgtk-6.0/WebKitNetworkProcess /usr/libexec/webkitgtk-6.0/WebKitNetworkProcess 2>/dev/null | head -1'

  release:
    name: publish the release
    needs: [package, verify-linux]
    if: startsWith(github.ref, 'refs/tags/app/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Which file?

            | System | File | Install |
            |---|---|---|
            | macOS (Apple Silicon) | `flowi-app_<version>_macos_arm64.zip` | unzip and open `flowi-gui.app` (right-click, Open the first time: not notarized yet) |
            | Windows 10 or later | `flowi-app_<version>_windows_amd64_setup.exe` | run it (SmartScreen warns: not signed yet) |
            | Debian 13, Ubuntu 24.04 or later | `flowi-app_<version>_linux_amd64.deb` | `sudo apt install ./flowi-app_*_linux_amd64.deb` |
            | Fedora | `flowi-app_<version>_linux_amd64.rpm` | `sudo dnf install ./flowi-app_*_linux_amd64.rpm` |
            | Arch, CachyOS, Manjaro | `flowi-app_<version>_linux_amd64.pkg.tar.zst` | `sudo pacman -U flowi-app_*_linux_amd64.pkg.tar.zst` |

            The Linux packages install what the window needs: GTK 4, WebKitGTK 6.0, libsoup 3, bubblewrap and
            xdg-dbus-proxy. The command is `flowi-app`, so it does not clash with the command line tool, `flowi`. They are built on Ubuntu 24.04, so they need glibc 2.39 or later.
