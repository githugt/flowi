# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

# "flowi-app", because the command line tool is "flowi" and both would otherwise install /usr/bin/flowi.
name: "flowi-app"
arch: ${GOARCH}
platform: "linux"
# From the release tag (see .github/workflows/release.yml); "0.1.0-alpha.1" becomes "0.1.0~alpha.1" in a deb or rpm,
# so a pre-release sorts before the release.
version: ${VERSION}
version_schema: semver
section: "default"
priority: "extra"
maintainer: "Flowi <githugt@users.noreply.github.com>"
description: "Compose API requests into flows"
vendor: "Flowi"
homepage: "https://github.com/githugt/flowi"
license: "AGPL-3.0-or-later"
release: "1"

# Under /usr, not /usr/local: that is where a distribution package belongs, and Arch packages may not use /usr/local.
contents:
  - src: "./bin/flowi-app"
    dst: "/usr/bin/flowi-app"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/flowi.png"
  - src: "./build/linux/desktop"
    dst: "/usr/share/applications/flowi.desktop"
  - src: "./LICENSE"
    dst: "/usr/share/licenses/flowi/LICENSE"

# What the window needs: GTK 4, WebKitGTK 6.0 and libsoup 3 (Ubuntu 24.04+ / Debian 13+), plus the two helpers
# WebKit starts to sandbox its web content: bubblewrap and xdg-dbus-proxy. Without them the window dies at start.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libsoup-3.0-0
  - bubblewrap
  - xdg-dbus-proxy

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - libsoup3
      - bubblewrap
      - xdg-dbus-proxy

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - libsoup3
      - bubblewrap
      - xdg-dbus-proxy

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
