openapi: 3.1.0
info:
  title: Shop
  version: 2.0.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  note: { type: [string, "null"] }
                  extra: {}
