id: 01JB0000000000000000000010
name: Login
default: "1"
versions:
  "1":
    method: POST
    url: "{{env.base}}/{{region}}/v1/login"
    headers:
      X-Signature: "{{vars.signature}}"
    body:
      json: |
        { "email": "{{email}}", "password": "{{password}}" }
    extract:
      token:
        from: body
        path: $.data.token
      subject:
        from: body
        path: $.data.sub
    assert:
      - status == 200
  "2":
    method: POST
    url: "{{env.base}}/v2/login"
    body:
      json: |
        { "email": "{{email}}", "tenant": "{{with.tenant}}", "locale": "{{locale ?? 'en'}}" }
    extract:
      token:
        from: body
        path: $.token
      session:
        from: cookie
        cookie: sid
    assert:
      - response.body.user.id != empty
    hooks:
      post:
        - inline:
            - id: has-user
              type: assert
              check: response.body.user.id != empty
hooks:
  pre:
    - flow:
        id: 01JB0000000000000000000021
        path: hooks/sign
  post:
    - flow:
        id: 01JB0000000000000000000020
        path: hooks/check-login
