asyncapi: 3.0.0
info: {title: my-example-app events, version: 1.0.0}
servers:
  nats:
    host: localhost:4222
    protocol: nats
channels:
  example:
    address: examples.{id}
    parameters:
      id: {}
    messages:
      example:
        payload:
          type: object
          properties:
            name: {type: string}
        examples:
          - payload: {name: first}
operations:
  publishExample:
    action: send
    channel: {$ref: '#/channels/example'}
  requestExample:
    action: send
    channel: {$ref: '#/channels/example'}
    reply:
      channel: {$ref: '#/channels/example'}
