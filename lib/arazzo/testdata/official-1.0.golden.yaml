arazzo: 1.0.1
info:
  title: fetchPet
  version: 1.0.0
sourceDescriptions:
  - name: petstore
    url: ./petstore.openapi.yaml
    type: openapi
workflows:
  - workflowId: fetchPet
    steps:
      - stepId: fetch
        operationId: $sourceDescriptions.petstore.getPet
        parameters:
          - name: petId
            in: path
            value: $inputs.petId
        outputs:
          petId: "$response.body#/id"
    outputs:
      petId: $steps.fetch.outputs.petId
